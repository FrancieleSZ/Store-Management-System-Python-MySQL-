<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Loja</title>
  <!-- CSS separado, conectado via <link> -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page">
    <!-- Cabeçalho -->
    <header class="header">
      <div>
        <div class="eyebrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B98B2A" stroke-width="2">
            <path d="M8 3v4M16 3v4M3 8h18M6 8v11a2 2 0 002 2h8a2 2 0 002-2V8" />
          </svg>
          <span>Livro de vendas — atualizado hoje</span>
        </div>
        <h1>Sistema de Loja</h1>
      </div>
      <div class="header-total">
        <span class="label">Faturamento de hoje</span>
        <div id="faturamento-hoje" class="header-total-value">R$ 0,00</div>
      </div>
    </header>

    <!-- Navegação -->
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="painel">Painel</button>
      <button class="tab" data-tab="venda">Nova Venda</button>
      <button class="tab" data-tab="relatorio">Relatório</button>
      <button class="tab" data-tab="funcionarios">Funcionários</button>
    </nav>

    <!-- Conteúdo dinâmico -->
    <main id="app-content"></main>

    <p class="footnote">
      Protótipo de interface — os dados vivem apenas nesta sessão do navegador. Conecte a uma API (ex.: Flask/FastAPI)
      sobre o seu script Python para persistir no MySQL.
    </p>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- JS separado, conectado via <script src> -->
  <script src="script.js"></script>
</body>
</html>
